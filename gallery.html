<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-body">
    <h1>
                Welcome to the CloudPic Gallery!
    </h1>
    <div class="parent-grid">
        <img src="images/face1.jpg" alt="Photo 1" class="gallery-image">
        <img src="images/face2.jpg" alt="Photo 2" class="gallery-image">
        <img src="images/face3.jpg" alt="Photo 3" class="gallery-image">
        <img src="images/face4.jpg" alt="Photo 4" class="gallery-image">
        <img src="images/face5.jpg" alt="Photo 5" class="gallery-image">
        <img src="images/face6.avif" alt="Photo 6" class="gallery-image">
        <img src="images/face7.avif" alt="Photo 7" class="gallery-image">
        <img src="images/face8.jpeg" alt="Photo 8" class="gallery-image">
        <img src="images/face9.jpeg" alt="Photo 9" class="gallery-image">
        <img src="images/face10.jpg" alt="Photo 10" class="gallery-image">
        <img src="images/face11.jpg" alt="Photo 11" class="gallery-image">
        <img src="images/face12.jpg" alt="Photo 12" class="gallery-image">
    </div>

    <div class="upload-section">
        <input type="file" accept="image/*" id="uploadImage" /><br>
        <button id="uploadButton">Upload Image</button>
   
</body>
</html>
